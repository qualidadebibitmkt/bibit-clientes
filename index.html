<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bibit · Clientes &amp; Operação</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css?v=72" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Bibit — marketing para bebidas"><span class="brand-fallback" style="height:92px;width:172px"></span></a>

    <div class="controls">
      <div class="client-picker" id="clientPicker">
        <select class="client-select" id="clientSelect" aria-label="Filtrar por cliente"></select>
      </div>

      <nav class="tabs" role="tablist" aria-label="Visões">
        <button class="tab is-active" data-view="geral" role="tab" aria-selected="true"><svg class="tab-ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="13" y="3" width="8" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="3" y="13" width="8" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="13" y="13" width="8" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>Visão geral</button>
        <button class="tab" data-view="health" role="tab" aria-selected="false"><svg class="tab-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12h4l2.5-6 3.5 12 3-8 1.5 2H22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>Health Score</button>
        <button class="tab" data-view="trafego" role="tab" aria-selected="false"><svg class="tab-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V9M10 19V5M16 19v-8M22 19H2" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>Tráfego</button>
        <button class="tab" data-view="satisfacao" role="tab" aria-selected="false"><svg class="tab-ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8.5 14.5c1 1.2 2.2 1.8 3.5 1.8s2.5-.6 3.5-1.8M9 10h.01M15 10h.01" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>Satisfação</button>
        <button class="tab" data-view="produtividade" role="tab" aria-selected="false"><svg class="tab-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l4 4L19 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Produtividade</button>
        <button class="tab" data-view="contato" role="tab" aria-selected="false"><svg class="tab-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>Contato</button>
        <button class="tab" data-view="calendario" role="tab" aria-selected="false"><svg class="tab-ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 10h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M8 14h2M12 14h2M16 14h2M8 18h2M12 18h2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Calendários</button>
      </nav>
    </div>
  </header>

  <main id="app">
    <div class="state state-loading" id="stateLoading">
      <div class="pour" aria-hidden="true"></div>
      <p>Enchendo os copos…</p>
    </div>
    <div class="state" id="stateError" hidden></div>

    <section id="viewGeral" class="view" hidden></section>
    <section id="viewCalendario" class="view" hidden></section>
    <section id="viewFuncoes" class="view" hidden></section>
    <section id="viewHealth" class="view" hidden></section>
    <section id="viewPilar" class="view" hidden></section>
  </main>

  <footer class="foot">
    <span id="footInfo"></span>
  </footer>

  <script src="/app.js?v=72"></script>
</body>
</html>
